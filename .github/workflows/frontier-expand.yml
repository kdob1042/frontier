name: Frontier supplementary long-form collection
on:
  push:
    branches: [curation/frontier-1000-expand-20261002]
    paths:
      - scripts/expand_frontier_catalog.py
      - .github/workflows/frontier-expand.yml
permissions:
  contents: write
concurrency:
  group: frontier-catalog-extra-20261002
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 beautifulsoup4==4.13.4 lxml==5.4.0 trafilatura==2.0.0
      - name: Collect supplementary public long-form articles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -u scripts/expand_frontier_catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-1000-extra
          path: data/frontier-1000-extra-20261002/
          retention-days: 30
          if-no-files-found: warn
