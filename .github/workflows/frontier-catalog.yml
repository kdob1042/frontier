name: Frontier 1000 long-form catalog
on:
  push:
    branches: [curation/frontier-1000-20261002]
    paths:
      - scripts/collect_frontier_catalog.py
      - .github/workflows/frontier-catalog.yml
permissions:
  contents: write
concurrency:
  group: frontier-catalog-20261002
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded HTML extraction dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.13.4 lxml==5.4.0 trafilatura==2.0.0
      - name: Collect and individually screen public long-form articles
        run: |
          python -u - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('collector', 'scripts/collect_frontier_catalog.py')
          collector = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(collector)
          # Explicit publisher policy excludes Guardian from this collection.
          collector.SOURCES = [s for s in collector.SOURCES if s['id'] != 'guardian']
          collector.main()
          PY
      - name: Preserve results in the collection branch
        if: ${{ !cancelled() }}
        run: |
          if [ -d data/frontier-1000-20261002 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/frontier-1000-20261002
            git diff --cached --quiet || git commit -m 'Save verified Frontier catalog and rejection audit [skip ci]'
            git push origin HEAD:curation/frontier-1000-20261002
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-1000-catalog
          path: data/frontier-1000-20261002/
          retention-days: 30
          if-no-files-found: warn
      - name: Report verified count without claiming completion on shortfall
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/frontier-1000-20261002/report.json')
          if p.exists():
              r = json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('# Frontier collection\n\n')
                  f.write(f"Selected: **{r['selected']} / 1000**\n\n")
                  f.write(f"Body-verified pool: {r['verified_pool']}; article attempts: {r['article_attempts']}\n\n")
                  f.write('No article bodies or full translations are exported. No production records were altered.\n\n')
                  f.write('```json\n' + json.dumps(r, ensure_ascii=False, indent=2) + '\n```\n')
          PY
